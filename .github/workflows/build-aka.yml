name: Build Gamebuino AKA Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Joindre le paquet carte SD à une Release GitHub'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag de la Release (ex. v1.0.0). Vide = v1.0.<n° d exécution>'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # 1. Test PC du coeur de jeu, du rendu et des sons (g++, sans ESP-IDF)
  host:
    name: Test PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test hôte (physique, états, sons, rendu)
        run: bash test/host/run.sh

  # 2. Compilation ESP-IDF 5.5.1 (ESP32-S3) + dossier carte SD du loader AKA
  firmware:
    name: Firmware ESP32-S3 (ESP-IDF 5.5.1)
    needs: host
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Mémoire
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size | tail -25

      - name: Préparer le dossier carte SD
        shell: bash
        run: |
          set -e
          BIN=build/frogball_aka.bin
          test -f "$BIN"
          rm -rf dist && mkdir -p dist/frogball dist/AKA
          cp -r sdcard_files/frogball/. dist/frogball/
          cp -r sdcard_files/AKA/. dist/AKA/
          cp "$BIN" dist/frogball/firmware.bin
          python3 - <<'PY'
          import json, datetime
          p = "dist/frogball/meta.json"
          m = json.load(open(p, encoding="utf-8"))
          m["date"] = datetime.date.today().isoformat()
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(p, "a").write("\n")
          PY
          cat > dist/LISEZMOI.txt <<'TXT'
          FROGBALL - INSTALLATION
          =======================
          1. Copiez les dossiers "frogball" et "AKA" a la racine de la carte SD de la Gamebuino AKA.
             ("AKA" est commun a tous les jeux : ne remplacez pas une version plus recente.)
          2. Lancez le jeu depuis le loader. Tournez la console de 90 degres vers la droite.

          COMMANDES
            A / L1 / Gauche   flipper gauche
            D / Droite        flipper droit
            R1 / Bas          ressort (maintenir, relacher pour tirer)
            B / Haut          secousse (attention au TILT)
            MENU              menu systeme du loader (pause, commandes, langue, retour au loader)
          TXT
          mkdir -p out
          (cd dist && zip -r ../out/Frogball-AKA-sdcard.zip frogball AKA LISEZMOI.txt)
          cp "$BIN" out/Frogball-AKA-firmware.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Gamebuino-AKA-Frogball
          path: out/*
          if-no-files-found: error
          retention-days: 90

  # 3. Publication sur GitHub Releases (tag v* ou déclenchement manuel)
  release:
    name: Publier le firmware AKA
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gamebuino-AKA-Frogball
          path: release
      - name: Tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then T="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then T="${{ inputs.release_tag }}"
          else T="v1.0.${{ github.run_number }}"; fi
          echo "name=$T" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Frogball AKA ${{ steps.tag.outputs.name }}
          files: release/*
